name: Build AGN 2026
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare upload signing key
        env:
          KEYSTORE: ${{ secrets.AGN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/agn-upload.jks"
            echo "AGN_KEYSTORE_PATH=$RUNNER_TEMP/agn-upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Browser gameplay verification
        run: |
          npm install --prefix "$RUNNER_TEMP/agn-ui" playwright@1.64.0
          "$RUNNER_TEMP/agn-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/agn-ui/node_modules" node tests/ui.cjs
      - name: Build APK and AAB
        env:
          AGN_STORE_PASSWORD: ${{ secrets.AGN_STORE_PASSWORD }}
          AGN_KEY_ALIAS: ${{ secrets.AGN_KEY_ALIAS }}
          AGN_KEY_PASSWORD: ${{ secrets.AGN_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AGN-2026-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.html
            ui-home.png
